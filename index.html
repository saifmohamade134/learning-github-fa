
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اولین وب‌سایت من</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 30px 15px;
            color: #26364a;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #0001;
        }

        h1 {
            color: #1769aa;
        }

        p {
            line-height: 2;
        }

        .button {
            display: inline-block;
            background: #1769aa;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>سلام، به سایت من خوش آمدید</h1>

        <p>
            این اولین وب‌سایت من است
            که با HTML و CSS ساخته‌ام.
        </p>

        <h2>اهداف من</h2>

        <p>
            یادگیری برنامه‌نویسی<br>
            یادگیری GitHub<br>
            ساخت پروژه‌های کاربردی
        </p>

        <a class="button" href="https://github.com/">
            ورود به GitHub
        </a>
    </div>

</body>
</html>
